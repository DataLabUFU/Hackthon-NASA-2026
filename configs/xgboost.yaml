# Experimento xgboost
# Uso: python -m models.xgboost.<train|benchmark|inference> [--config configs/xgboost.yaml] [chave=valor ...]

seed: 42
output_dir: artifacts

data:
  path: data/train.csv     # .csv ou .parquet
  target: target
  drop: []                 # ex.: [id]
  task: auto               # auto | classification | regression
  demo: false              # true = dataset sintético (ignora path/target)

# Sobrescrevem os padrões de models/xgboost/model.py (chaves omitidas usam o padrão).
params:
  # XGBoost: https://xgboost.readthedocs.io/en/stable/parameter.html
  n_estimators: 500
  learning_rate: 0.05
  max_depth: 6
  min_child_weight: 1
  subsample: 0.8
  colsample_bytree: 0.8
  reg_lambda: 1.0

train:
  test_size: 0.2           # 0 = treina com o dataset inteiro

benchmark:
  folds: 5
  n_jobs: 1

inference:
  input: data/test.csv
  output: predictions/xgboost.csv
  model: null              # null = último treino; ou artifacts/xgboost/runs/<run_id>
  proba: true
  keep: []                 # colunas do input copiadas para a saída, ex.: [id]
