# Experimento lightgbm
# Uso: python -m models.lightgbm.<train|benchmark|inference> [--config configs/lightgbm.yaml] [chave=valor ...]

seed: 42
output_dir: artifacts

data:
  path: data/train.csv     # .csv ou .parquet
  target: target
  drop: []                 # ex.: [id]
  task: auto               # auto | classification | regression
  demo: false              # true = dataset sintético (ignora path/target)

# Sobrescrevem os padrões de models/lightgbm/model.py (chaves omitidas usam o padrão).
params:
  # LightGBM: https://lightgbm.readthedocs.io/en/latest/Parameters.html
  n_estimators: 500
  learning_rate: 0.05
  num_leaves: 31
  min_child_samples: 20
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  reg_lambda: 0.0

train:
  test_size: 0.2           # 0 = treina com o dataset inteiro

benchmark:
  folds: 5
  n_jobs: 1

inference:
  input: data/test.csv
  output: predictions/lightgbm.csv
  model: null              # null = último treino; ou artifacts/lightgbm/runs/<run_id>
  proba: true
  keep: []                 # colunas do input copiadas para a saída, ex.: [id]
